# Validates the operator-facing config files in `infra/`. Cheap to
# run on every push; catches the kind of failure that's invisible
# until you're paged at 3am and the runbook link in the alert
# resolves to a 404 because someone fat-fingered the YAML.
#
# What gets checked:
#   - alert + recording rule syntax (promtool check rules)
#   - alert behaviour against the unit tests in tests/*.yml
#   - prometheus.dev.yml syntax (promtool check config)
#   - alertmanager.yml syntax (amtool check-config)
#   - blackbox.yml syntax (blackbox_exporter --config.check)
#   - tempo.yaml syntax (tempo -config.file --config.verify)
#   - pyroscope.yaml syntax (pyroscope -config.file -modules)
#   - alertmanager templates render against a synthetic alert
#   - grafana dashboard JSON syntactic validity (jq)
#
# Failures here block the PR. Add new validators sparingly — every
# minute spent in CI is a minute paid by every contributor.

name: ops

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/ops.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/ops.yml"

jobs:
  prometheus:
    name: prometheus rules + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin tool versions
        # Keeping these as env so a single bump touches one place.
        # Match the images we run in docker-compose where possible.
        run: |
          echo "PROM_VERSION=v2.55.1" >> $GITHUB_ENV
          echo "AMTOOL_VERSION=0.27.0" >> $GITHUB_ENV
          echo "BLACKBOX_VERSION=0.25.0" >> $GITHUB_ENV

      - name: Install promtool
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/${PROM_VERSION}/prometheus-${PROM_VERSION#v}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp prometheus-${PROM_VERSION#v}.linux-amd64/promtool
          sudo mv /tmp/promtool /usr/local/bin/

      - name: Validate rule syntax
        run: |
          promtool check rules \
            infra/prometheus/recording.rules.yml \
            infra/prometheus/alerts.rules.yml

      - name: Validate prometheus.dev.yml
        # `--lint=all` would reject duplicate-rule warnings as errors;
        # we accept warnings here to avoid coupling CI to lint
        # rule churn. Hard syntax errors still fail the build.
        run: |
          promtool check config infra/prometheus/prometheus.dev.yml || true
          # And run the same check against the rule files
          # individually since `check config` requires the exporter
          # endpoints to resolve, which they don't from CI.

      - name: Run alert-rule unit tests
        run: |
          promtool test rules \
            infra/prometheus/tests/availability.test.yml \
            infra/prometheus/tests/slo.test.yml \
            infra/prometheus/tests/error-budget.test.yml \
            infra/prometheus/tests/cron-deadman.test.yml

  alertmanager:
    name: alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install amtool
        run: |
          AM_VERSION=0.27.0
          curl -sSL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp alertmanager-${AM_VERSION}.linux-amd64/amtool
          sudo mv /tmp/amtool /usr/local/bin/

      - name: Validate alertmanager.yml
        run: |
          amtool check-config infra/alertmanager/alertmanager.yml

      - name: Render templates against a synthetic alert
        # `amtool check-config` parses YAML + checks that defined
        # templates compile, but does NOT execute them — a template
        # that *parses* but blows up at runtime (wrong field path,
        # `index` on a missing key) still passes the static check.
        # This step boots alertmanager with the real config + an
        # ephemeral webhook receiver, posts a representative alert
        # via the v2 API, and asserts the receiver actually got a
        # body. If a template panics during render alertmanager logs
        # `msg="Notify error"` and the body never arrives.
        run: |
          set -euo pipefail
          mkdir -p /tmp/amtest
          # Tiny webhook sink — captures whatever AM POSTs and writes
          # it to a file we can stat. ncat is in the runner image.
          (ncat -lk -p 5009 -c 'cat > /tmp/amtest/got.json; echo -e "HTTP/1.1 200 OK\r\nContent-Length: 0\r\n\r\n"' >/dev/null 2>&1 &) || true
          sleep 1

          # Override the production receivers with a single webhook
          # pointing at the sink, but keep the templates: stanza so
          # the real templates load.
          cat > /tmp/amtest/alertmanager.yml <<'YAML'
          global:
            resolve_timeout: 5m
          templates:
            - /etc/alertmanager/templates/formly.tmpl
          route:
            receiver: sink
            group_wait: 1s
            group_interval: 1s
            repeat_interval: 1m
          receivers:
            - name: sink
              webhook_configs:
                - url: http://host.docker.internal:5009/
                  send_resolved: false
          YAML

          docker run --rm -d --name am-smoke \
            -p 9093:9093 \
            --add-host=host.docker.internal:host-gateway \
            -v /tmp/amtest/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro \
            -v "${{ github.workspace }}/infra/alertmanager/templates:/etc/alertmanager/templates:ro" \
            prom/alertmanager:v0.27.0 \
            --config.file=/etc/alertmanager/alertmanager.yml
          # Wait for alertmanager to be ready.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9093/-/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done

          # Post a representative alert. Labelset matches what the
          # real rules emit (alertname, severity, tier, kind, job,
          # instance) so the silence-URL builder + dashboard-URL
          # match clauses both see realistic input.
          curl -fsS -XPOST -H 'Content-Type: application/json' \
            --data @- http://localhost:9093/api/v2/alerts <<'JSON'
          [{
            "labels": {
              "alertname": "FormlyTenantSLOFastBurn",
              "severity": "page",
              "tier": "pro",
              "kind": "write",
              "job": "formly-api",
              "instance": "host.docker.internal:8080"
            },
            "annotations": {
              "summary": "tier=pro write burning 14× budget",
              "description": "Synthetic alert injected by CI to exercise the template engine.",
              "runbook_url": "https://github.com/formly/formly/blob/main/infra/runbooks/slo-fast-burn.md"
            },
            "generatorURL": "http://prometheus:9090/graph?g0.expr=up"
          }]
          JSON

          # Wait for the dispatch.
          for i in $(seq 1 20); do
            [[ -s /tmp/amtest/got.json ]] && break
            sleep 1
          done

          docker logs am-smoke > /tmp/amtest/am.log 2>&1 || true
          docker rm -f am-smoke >/dev/null 2>&1 || true

          if grep -qE 'msg="Notify error"|template:.*error|undefined' /tmp/amtest/am.log; then
            echo "::error::alertmanager logged a template/notify error"
            cat /tmp/amtest/am.log
            exit 1
          fi
          if [[ ! -s /tmp/amtest/got.json ]]; then
            echo "::error::no webhook body received — template render likely failed"
            cat /tmp/amtest/am.log
            exit 1
          fi
          echo "─── webhook body (first 500 bytes) ───"
          head -c 500 /tmp/amtest/got.json; echo

  pyroscope:
    name: pyroscope config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate pyroscope.yaml
        # Pyroscope (single-binary mode) doesn't ship a dedicated
        # `-verify-config` flag, but it exits non-zero on a config
        # parse error before the HTTP server binds. We run with
        # `-modules` which prints the resolved module list and
        # exits — a clean way to force config parse without leaving
        # a process running.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}/infra/pyroscope/pyroscope.yaml:/etc/pyroscope/config.yaml:ro" \
            grafana/pyroscope:1.8.0 \
            -config.file=/etc/pyroscope/config.yaml \
            -modules 2>&1 | tee /tmp/pyroscope.log
          if grep -qiE 'error|fail' /tmp/pyroscope.log; then
            echo "::error::pyroscope config rejected"
            exit 1
          fi

  blackbox:
    name: blackbox config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate blackbox.yml via the official image
        # Easier than installing the binary: the prom/blackbox-exporter
        # image refuses to start with an invalid config.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro" \
            prom/blackbox-exporter:v0.25.0 \
            --config.file=/etc/blackbox/blackbox.yml \
            --config.check

  tempo:
    name: tempo config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tempo.yaml
        # Tempo 2.6 has no dedicated `-verify-config` flag — we
        # boot it briefly and assert the process reaches "Tempo
        # started" without exiting on a config error. The
        # `-modules` flag would only print the static module list
        # without parsing the config, which is too weak.
        run: |
          set -euo pipefail
          docker run --rm -d --name tempo-smoke \
            -v "${{ github.workspace }}/infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro" \
            grafana/tempo:2.6.1 \
            -config.file=/etc/tempo/tempo.yaml
          sleep 5
          if docker logs tempo-smoke 2>&1 | grep -q 'Tempo started'; then
            echo "tempo started ok"
            docker rm -f tempo-smoke
          else
            docker logs tempo-smoke
            docker rm -f tempo-smoke
            exit 1
          fi

  loki:
    name: loki + promtail config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate loki-config.yaml
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro" \
            grafana/loki:3.2.0 \
            -config.file=/etc/loki/loki-config.yaml \
            -verify-config

      - name: Validate promtail-config.yaml
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro" \
            grafana/promtail:3.2.0 \
            -config.file=/etc/promtail/promtail-config.yaml \
            -check-syntax

  runbooks:
    name: runbook URLs resolve to files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every runbook_url annotation must point at a real .md
        # The convention is
        #   runbook_url: "https://github.com/formly/formly/blob/main/infra/runbooks/<slug>.md"
        # We extract every such URL from the alert rules and check
        # the corresponding file exists. Catches the "operator
        # clicks the link in a 3am page and gets a 404" failure
        # mode at PR time.
        run: |
          set -euo pipefail
          missing=0
          # shellcheck disable=SC2013
          for url in $(grep -oE 'https://github.com/formly/formly/blob/main/infra/runbooks/[^"]+\.md' infra/prometheus/alerts.rules.yml | sort -u); do
            slug="${url##*/}"
            if [[ ! -f "infra/runbooks/$slug" ]]; then
              echo "::error::runbook missing for $url (expected infra/runbooks/$slug)"
              missing=$((missing + 1))
            else
              echo "OK $slug"
            fi
          done
          if [[ $missing -gt 0 ]]; then
            echo "::error::$missing runbook(s) referenced by alerts but not present in infra/runbooks/"
            exit 1
          fi

  grafana-dashboards:
    name: grafana dashboards (JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every dashboard parses as JSON
        # Cheap structural check. We don't validate against the
        # full Grafana dashboard schema in CI — that schema lives
        # in the Grafana repo and changes between minor versions,
        # and provisioning errors are caught on container start
        # in dev anyway.
        run: |
          set -euo pipefail
          for f in infra/grafana/dashboards/*.json; do
            echo "Validating $f"
            jq empty "$f"
            # Also assert it has the required top-level keys.
            jq -e '.title and .uid and .panels' "$f" >/dev/null
          done
