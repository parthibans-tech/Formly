# Formly — docker-compose-based deploy pipeline.
#
# TAG GRAMMAR (decides what builds + deploys):
#
#   api-v<X.Y.Z>      → deploy ONLY the Go API
#                       e.g. git tag api-v1.4.2 && git push --tags
#
#   web-v<X.Y.Z>      → deploy ONLY the Next.js web app
#                       e.g. git tag web-v0.9.1 && git push --tags
#
#   release-v<X.Y.Z>  → deploy BOTH (use when a change crosses both
#                       halves and they need to ship together)
#                       e.g. git tag release-v2.0.0 && git push --tags
#
# Why split: a typo fix in the web costs ~3 min of API rebuild that
# changed nothing. Splitting keeps API-only deploys to ~1.5 min and
# rules out "did this web change affect the API?" anxiety.
#
# The version suffix (X.Y.Z) ends up as the docker image tag in
# ghcr.io and the VERSION ldflag in the Go binary, so /healthz can
# echo it.
#
# DEPLOY MECHANICS (per tag) — mirrors scripts/deploy/manual-deploy.sh:
#
#   1. plan job        — parses the tag, decides which build job(s) run.
#   2. build-* jobs    — docker buildx → push to ghcr.io.
#                        Runner does the heavy lifting; VPS CPU stays free.
#   3. deploy job      — SSHes to the VPS via appleboy/ssh-action and:
#                        a. docker login ghcr.io   (so we can pull)
#                        b. docker pull <new image(s)>
#                        c. rewrite IMAGE_* lines in /opt/formly/.env
#                        d. docker compose up -d --no-deps <changed services>
#                        Containers we didn't redeploy keep running.
#   4. smoke tests     — curl /healthz to confirm the new image is live.
#
# REQUIRED REPO SECRETS:
#   HOSTINGER_HOST       — VPS IP or hostname
#   HOSTINGER_USER       — `deploy`
#   HOSTINGER_SSH_KEY    — private key (PEM) for the deploy user.
#   HOSTINGER_SSH_PORT   — optional, default 22
#
# REQUIRED REPO VARS (Settings → Variables → Actions):
#   API_DOMAIN           — api.drive360.nearbyme.app
#   WEB_DOMAIN           — drive360.nearbyme.app
#
# REGISTRY:
#   Pushed to ghcr.io/<owner>/<repo>-{api,web}. Auth on both push
#   (runner) and pull (VPS) uses the auto-generated GITHUB_TOKEN —
#   it's valid for the duration of the workflow run, which is more
#   than enough for the VPS to docker-login + pull. No long-lived PAT
#   needed.

name: deploy

on:
  push:
    tags:
      - "api-v*"
      - "web-v*"
      - "release-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which side(s) to deploy (manual override)"
        required: true
        type: choice
        default: release
        options:
          - api
          - web
          - release

# Don't run two deploys to the same ref simultaneously — the second
# one's `docker compose up` would race the first.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ═════════════════════════════════════════════════════════════
  # Parse the tag → decide which halves deploy + extract version.
  # All downstream jobs read these outputs.
  # ═════════════════════════════════════════════════════════════
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
      deploy_web: ${{ steps.decide.outputs.deploy_web }}
      image_tag:  ${{ steps.decide.outputs.image_tag }}
      repo_lower: ${{ steps.decide.outputs.repo_lower }}
    steps:
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            image_tag="manual-$(date -u +%Y%m%d-%H%M%S)"
          else
            ref="${GITHUB_REF#refs/tags/}"
            case "$ref" in
              api-v*)     target=api;     image_tag="${ref#api-v}";;
              web-v*)     target=web;     image_tag="${ref#web-v}";;
              release-v*) target=release; image_tag="${ref#release-v}";;
              *) echo "::error::Unknown tag shape: $ref"; exit 1;;
            esac
          fi
          case "$target" in
            api)     api=true;  web=false ;;
            web)     api=false; web=true  ;;
            release) api=true;  web=true  ;;
          esac
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "deploy_api=$api"   >> "$GITHUB_OUTPUT"
          echo "deploy_web=$web"   >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$repo_lower" >> "$GITHUB_OUTPUT"
          echo "Plan: api=$api web=$web tag=$image_tag repo=$repo_lower"

  # ═════════════════════════════════════════════════════════════
  # Build + push the API image. Skipped when deploy_api=false.
  # ═════════════════════════════════════════════════════════════
  build-api:
    needs: plan
    if: needs.plan.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-api:${{ needs.plan.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-api:latest
          build-args: |
            VERSION=${{ needs.plan.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ═════════════════════════════════════════════════════════════
  # Build + push the Web image. Skipped when deploy_web=false.
  # NEXT_PUBLIC_API_URL is baked in at build time → must come from
  # the API_DOMAIN repo variable.
  # ═════════════════════════════════════════════════════════════
  build-web:
    needs: plan
    if: needs.plan.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-web:${{ needs.plan.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ═════════════════════════════════════════════════════════════
  # SSH to the VPS → docker login ghcr.io → docker pull → rewrite
  # /opt/formly/.env → docker compose up. Only the services that
  # got rebuilt are recreated; postgres / redis / minio / caddy /
  # the not-being-deployed half keep running.
  #
  # The complex `if:` runs the deploy even when one build job is
  # skipped (api-only or web-only deploys). Default needs-semantics
  # treat skipped as "block dependents" — we override that by
  # checking the plan flags directly.
  # ═════════════════════════════════════════════════════════════
  deploy:
    needs: [plan, build-api, build-web]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.plan.outputs.deploy_api == 'true' || needs.plan.outputs.deploy_web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_API: ${{ needs.plan.outputs.deploy_api }}
      DEPLOY_WEB: ${{ needs.plan.outputs.deploy_web }}
      IMAGE_TAG:  ${{ needs.plan.outputs.image_tag }}
      # NB: ghcr.io is hardcoded here (not ${{ env.REGISTRY }})
      # because the `env` context is not in scope inside a job-level
      # `env:` block — GHA only resolves it inside steps.
      API_IMAGE:  ghcr.io/${{ needs.plan.outputs.repo_lower }}-api:${{ needs.plan.outputs.image_tag }}
      WEB_IMAGE:  ghcr.io/${{ needs.plan.outputs.repo_lower }}-web:${{ needs.plan.outputs.image_tag }}
      # GHCR_USER / GHCR_TOKEN are passed through to the VPS so it
      # can `docker login ghcr.io` and pull. github.actor is the user
      # that triggered the run; GITHUB_TOKEN has read:packages for
      # this repo's packages. Both have ~hours-of-validity, plenty
      # for the deploy step.
      GHCR_USER:  ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ─── 1. Login + pull on the VPS ──────────────────────────
      # Mirrors `manual-deploy.sh` step 5: the VPS authenticates to
      # ghcr.io with a short-lived token piped from the runner, then
      # pulls only the image(s) we just built.
      - name: VPS — docker login + pull image(s)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB,API_IMAGE,WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if [ "$DEPLOY_API" = "true" ]; then
              echo "→ pulling $API_IMAGE"
              docker pull "$API_IMAGE"
            fi
            if [ "$DEPLOY_WEB" = "true" ]; then
              echo "→ pulling $WEB_IMAGE"
              docker pull "$WEB_IMAGE"
            fi

      # ─── 2. Rewrite /opt/formly/.env ─────────────────────────
      # Compose reads ${API_IMAGE} / ${WEB_IMAGE} from .env. Updating
      # those lines is how we tell compose to use the freshly-pulled
      # image on the next `up -d`.
      - name: VPS — update /opt/formly/.env with new image tag(s)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB,API_IMAGE,WEB_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/formly
            if [ "$DEPLOY_API" = "true" ]; then
              sed -i "s|^API_IMAGE=.*|API_IMAGE=$API_IMAGE|" .env
            fi
            if [ "$DEPLOY_WEB" = "true" ]; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=$WEB_IMAGE|" .env
            fi
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            echo "--- post-edit:"
            grep -E '^(API_IMAGE|WEB_IMAGE|IMAGE_TAG)=' .env

      # ─── 3. Recreate only the changed services ───────────────
      # First-time deploys bring up the whole stack (postgres, caddy,
      # everything). Subsequent deploys only recreate api/web with
      # --no-deps so the database doesn't get bounced just because
      # api depends on it.
      - name: VPS — docker compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/formly

            services=""
            [ "$DEPLOY_API" = "true" ] && services="$services api"
            [ "$DEPLOY_WEB" = "true" ] && services="$services web"
            services=$(echo $services | xargs)

            if ! docker compose ps --quiet | grep -q .; then
              echo "(first run — bringing up the full stack)"
              docker compose up -d
            else
              echo "(incremental — recreating: $services)"
              docker compose up -d --no-deps $services
            fi
            docker compose ps

      # ─── 4. Smoke tests ──────────────────────────────────────
      # Hit the public domain so we're testing through Caddy / TLS /
      # DNS — not just the container's local port. Generous retry
      # window because Caddy fetches a fresh Let's Encrypt cert on
      # cold-start of a new domain (happens on first deploy only).

      - name: Smoke test API
        if: needs.plan.outputs.deploy_api == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "https://${{ vars.API_DOMAIN }}/healthz" >/dev/null; then
              echo "API healthy on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, sleeping 5s…"
            sleep 5
          done
          echo "::error::API health check failed after 60s"
          exit 1

      - name: Smoke test Web
        if: needs.plan.outputs.deploy_web == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            if curl -fsS --max-time 8 "https://${{ vars.WEB_DOMAIN }}/" >/dev/null; then
              echo "Web healthy on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web health check failed"
          exit 1
