# Formly — docker-compose deploy pipeline.
#
# FLOW:
#   git tag → push → GHA builds images → ghcr.io →
#     SSH to VPS → docker pull → docker compose up
#
# TAG GRAMMAR (decides what builds + deploys):
#
#   api-v<X.Y.Z>      → deploy ONLY the Go API
#   web-v<X.Y.Z>      → deploy ONLY the Next.js web app
#   release-v<X.Y.Z>  → deploy BOTH (use when a change crosses both
#                       halves and they need to ship together)
#
# Why split: a typo fix in the web costs ~3 min of API rebuild that
# changed nothing. Splitting keeps API-only deploys to ~1.5 min and
# rules out "did this web change affect the API?" anxiety.
#
# REQUIRED REPO SECRETS:
#   HOSTINGER_HOST       — VPS IP or hostname
#   HOSTINGER_USER       — `deploy`
#   HOSTINGER_SSH_KEY    — private key (PEM) for the deploy user.
#                          IMPORTANT: set via:
#                            gh secret set HOSTINGER_SSH_KEY < ~/.ssh/formly_deploy
#                          The web UI mangles newlines and corrupts the key.
#   HOSTINGER_SSH_PORT   — optional, default 22
#   GHCR_PAT             — classic PAT, scopes: write:packages, read:packages
#                          Used by both runner (push) and VPS (pull). Required
#                          because GITHUB_TOKEN can't reliably push/pull from
#                          user-namespace ghcr.io packages without manual UI
#                          linkage. PAT bypasses that.
#
# REQUIRED REPO VARIABLES (Settings → Variables → Actions):
#   API_DOMAIN           — api.drive360.nearbyme.app
#   WEB_DOMAIN           — drive360.nearbyme.app
#
# ONE-TIME VPS BOOTSTRAP (must be done BEFORE first CI deploy):
#   1. Run scripts/deploy/bootstrap-vps.sh on the VPS as root.
#      That installs Docker, creates the `deploy` user, lays out
#      /opt/formly/ with compose files + a starter .env.
#   2. Add the laptop's pubkey AND the runner's pubkey to
#      /home/deploy/.ssh/authorized_keys.
#   3. Edit /opt/formly/.env — set ACME_EMAIL.
#   4. Point DNS A records (api.drive360, drive360) at the VPS IP.
#
# After bootstrap, every deploy is just: `git tag … && git push --tags`.

name: deploy

on:
  push:
    tags:
      - "api-v*"
      - "web-v*"
      - "release-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which side(s) to deploy"
        required: true
        type: choice
        default: release
        options: [api, web, release]

# Don't run two deploys to the same ref simultaneously — the second
# one's `docker compose up` would race the first.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ═════════════════════════════════════════════════════════════
  # 1. PLAN — parse the tag, decide what to build/deploy.
  # ═════════════════════════════════════════════════════════════
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
      deploy_web: ${{ steps.decide.outputs.deploy_web }}
      image_tag:  ${{ steps.decide.outputs.image_tag }}
      repo_lower: ${{ steps.decide.outputs.repo_lower }}
    steps:
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            image_tag="manual-$(date -u +%Y%m%d-%H%M%S)"
          else
            ref="${GITHUB_REF#refs/tags/}"
            case "$ref" in
              api-v*)     target=api;     image_tag="${ref#api-v}";;
              web-v*)     target=web;     image_tag="${ref#web-v}";;
              release-v*) target=release; image_tag="${ref#release-v}";;
              *) echo "::error::Unknown tag shape: $ref"; exit 1;;
            esac
          fi
          case "$target" in
            api)     api=true;  web=false ;;
            web)     api=false; web=true  ;;
            release) api=true;  web=true  ;;
          esac
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Required-vars check — fail HERE, not in the middle of a deploy.
          missing=""
          [ -z "${{ vars.API_DOMAIN }}" ] && missing="$missing API_DOMAIN"
          [ -z "${{ vars.WEB_DOMAIN }}" ] && missing="$missing WEB_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo Variables:$missing"
            echo "  Set at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

          {
            echo "deploy_api=$api"
            echo "deploy_web=$web"
            echo "image_tag=$image_tag"
            echo "repo_lower=$repo_lower"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: api=$api web=$web tag=$image_tag repo=$repo_lower"

  # ═════════════════════════════════════════════════════════════
  # 2. PREFLIGHT — verify SSH + Docker on the VPS before spending
  #    5 minutes on a build that can't deploy. Fail-fast with the
  #    exact remediation step.
  # ═════════════════════════════════════════════════════════════
  preflight:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify SSH key secret format
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::HOSTINGER_SSH_KEY secret is empty"
            exit 1
          fi
          if ! printf '%s' "$KEY" | head -1 | grep -qE 'BEGIN (OPENSSH|RSA|EC|ED25519) PRIVATE KEY'; then
            echo "::error::HOSTINGER_SSH_KEY does not start with a valid PEM header."
            echo "  Symptom: 'error in libcrypto' or 'no key found'."
            echo "  Fix: from your laptop, replace via gh CLI (bypasses UI mangling):"
            echo "    gh secret set HOSTINGER_SSH_KEY < ~/.ssh/formly_deploy"
            exit 1
          fi
          echo "key header looks valid"

      - name: SSH + Docker reachability check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          command_timeout: 30s
          script: |
            set -euo pipefail
            echo "ssh ok"
            if ! docker ps >/dev/null 2>&1; then
              echo "::error::deploy user can't talk to docker daemon."
              echo "  Fix on VPS as root:"
              echo "    usermod -aG docker $USER && pkill -KILL -u $USER"
              exit 1
            fi
            echo "docker ok"
            if [ ! -f /opt/formly/docker-compose.yml ]; then
              echo "::error::/opt/formly/docker-compose.yml missing — bootstrap not run."
              echo "  Fix: run scripts/deploy/bootstrap-vps.sh on the VPS as root."
              exit 1
            fi
            if [ ! -f /opt/formly/.env ]; then
              echo "::error::/opt/formly/.env missing — bootstrap incomplete."
              echo "  Fix: run scripts/deploy/bootstrap-vps.sh on the VPS as root."
              exit 1
            fi
            echo "/opt/formly layout ok"

  # ═════════════════════════════════════════════════════════════
  # 3. BUILD-API — docker buildx → push to ghcr.io.
  # ═════════════════════════════════════════════════════════════
  build-api:
    needs: [plan, preflight]
    if: needs.plan.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Why GHCR_PAT, not GITHUB_TOKEN: GITHUB_TOKEN can fail to
          # push to user-namespace ghcr.io packages unless the package
          # has been manually linked to this repo in the UI. PAT
          # (classic, write:packages) bypasses that linkage rule.
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-api:${{ needs.plan.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-api:latest
          build-args: |
            VERSION=${{ needs.plan.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ═════════════════════════════════════════════════════════════
  # 4. BUILD-WEB — docker buildx → push to ghcr.io.
  #    NEXT_PUBLIC_API_URL gets baked into the JS bundle here.
  # ═════════════════════════════════════════════════════════════
  build-web:
    needs: [plan, preflight]
    if: needs.plan.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-web:${{ needs.plan.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_STORAGE_URL=https://${{ vars.S3_DOMAIN || vars.API_DOMAIN }}
            NEXT_PUBLIC_ONLYOFFICE_URL=https://${{ vars.OFFICE_DOMAIN || vars.API_DOMAIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ═════════════════════════════════════════════════════════════
  # 5. DEPLOY — sync compose files, pull images, recreate services.
  #
  # Runs even when one build job is skipped (api-only or web-only
  # tags). The complex `if` overrides the default needs-semantics
  # that treat `skipped` as failure.
  # ═════════════════════════════════════════════════════════════
  deploy:
    needs: [plan, preflight, build-api, build-web]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.preflight.result == 'success' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.plan.outputs.deploy_api == 'true' || needs.plan.outputs.deploy_web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_API: ${{ needs.plan.outputs.deploy_api }}
      DEPLOY_WEB: ${{ needs.plan.outputs.deploy_web }}
      IMAGE_TAG:  ${{ needs.plan.outputs.image_tag }}
      # ghcr.io is hardcoded — env.REGISTRY isn't in scope inside
      # a job-level env block (GHA quirk).
      API_IMAGE:  ghcr.io/${{ needs.plan.outputs.repo_lower }}-api:${{ needs.plan.outputs.image_tag }}
      WEB_IMAGE:  ghcr.io/${{ needs.plan.outputs.repo_lower }}-web:${{ needs.plan.outputs.image_tag }}
      GHCR_USER:  ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
    steps:
      - uses: actions/checkout@v4

      # ─── 5a. Sync infra/compose/* + decrypt secrets → /opt/formly/
      # docker-compose.yml + Caddyfile sync from the repo. The .env is
      # decrypted from infra/compose/.env.sops on the runner using the
      # SOPS_AGE_KEY secret, then scp'd as .env.decrypted and renamed
      # to .env on the VPS. Whoever has the age private key is the
      # source of truth for production secrets — not the VPS itself.
      # Decrypt the SOPS-encrypted .env on the runner BEFORE shipping
      # to the VPS. The runner's age private key is the SOPS_AGE_KEY
      # secret; it never lands on disk on the VPS.
      - name: Install sops + age
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64" \
            -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          sudo apt-get install -y age
          sops --version

      - name: Decrypt .env from infra/compose/.env.sops
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "::error::SOPS_AGE_KEY secret is empty"
            echo "  Generate a CI keypair, add the pubkey to .sops.yaml,"
            echo "  re-encrypt with \`sops updatekeys\`, then:"
            echo "    gh secret set SOPS_AGE_KEY < /path/to/ci-private-key.txt"
            exit 1
          fi
          sops --decrypt --input-type dotenv --output-type dotenv \
            infra/compose/.env.sops > infra/compose/.env.decrypted
          chmod 600 infra/compose/.env.decrypted
          echo "decrypted $(wc -l < infra/compose/.env.decrypted) lines"

      - name: VPS — sync compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          source: "infra/compose/docker-compose.yml,infra/compose/Caddyfile,infra/compose/postgres-init.sql,infra/compose/.env.decrypted"
          target: "/opt/formly/"
          strip_components: 2
          overwrite: true

      - name: VPS — install decrypted env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/formly
            mv .env.decrypted .env
            chmod 600 .env

      # ─── 5b. docker login + pull on VPS ──────────────────────
      - name: VPS — docker login + pull image(s)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB,API_IMAGE,WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if [ "$DEPLOY_API" = "true" ]; then
              echo "→ pulling $API_IMAGE"
              docker pull "$API_IMAGE"
            fi
            if [ "$DEPLOY_WEB" = "true" ]; then
              echo "→ pulling $WEB_IMAGE"
              docker pull "$WEB_IMAGE"
            fi

      # ─── 5c. Update /opt/formly/.env + compose up ────────────
      # One SSH session for both — saves a second handshake. The
      # update-then-up sequence must stay atomic; running them in
      # separate steps risks compose seeing stale env vars.
      - name: VPS — update .env and bring stack up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB,API_IMAGE,WEB_IMAGE,IMAGE_TAG
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/formly

            # Append IMAGE_* lines to .env if they don't exist yet.
            # Lets a freshly-bootstrapped host work even if .env.example
            # didn't include them. Idempotent: grep gates the append.
            grep -q '^API_IMAGE=' .env || echo "API_IMAGE=" >> .env
            grep -q '^WEB_IMAGE=' .env || echo "WEB_IMAGE=" >> .env
            grep -q '^IMAGE_TAG=' .env || echo "IMAGE_TAG=" >> .env

            if [ "$DEPLOY_API" = "true" ]; then
              sed -i "s|^API_IMAGE=.*|API_IMAGE=$API_IMAGE|" .env
            fi
            if [ "$DEPLOY_WEB" = "true" ]; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=$WEB_IMAGE|" .env
            fi
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            echo "--- post-edit:"
            grep -E '^(API_IMAGE|WEB_IMAGE|IMAGE_TAG)=' .env

            services=""
            [ "$DEPLOY_API" = "true" ] && services="$services api"
            [ "$DEPLOY_WEB" = "true" ] && services="$services web"
            services=$(echo $services | xargs)

            if ! docker compose ps --quiet | grep -q .; then
              echo "(first run — bringing up the full stack)"
              docker compose up -d
            else
              echo "(incremental — recreating: $services)"
              docker compose up -d --no-deps $services
            fi
            echo
            docker compose ps

            # Trim images older than a week so the disk doesn't fill.
            docker image prune -af --filter "until=168h" || true

  # ═════════════════════════════════════════════════════════════
  # 6. SMOKE TESTS — separate job so a deploy-success/test-failure
  #    is visually distinct from a deploy failure in GHA UI.
  # ═════════════════════════════════════════════════════════════
  smoke:
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test API
        if: needs.plan.outputs.deploy_api == 'true'
        run: |
          set -euo pipefail
          # Generous retry: Caddy may be fetching a Let's Encrypt cert
          # on first deploy of a new domain (~30-60s).
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "https://${{ vars.API_DOMAIN }}/healthz" >/dev/null; then
              echo "API healthy on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, sleeping 5s…"
            sleep 5
          done
          echo "::error::API health check failed after 60s"
          exit 1

      - name: Smoke test Web
        if: needs.plan.outputs.deploy_web == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            if curl -fsS --max-time 8 "https://${{ vars.WEB_DOMAIN }}/" >/dev/null; then
              echo "Web healthy on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web health check failed"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Deploy succeeded ✅"
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Image tag: \`${{ needs.plan.outputs.image_tag }}\`"
            echo "- API: ${{ needs.plan.outputs.deploy_api }}"
            echo "- Web: ${{ needs.plan.outputs.deploy_web }}"
          } >> "$GITHUB_STEP_SUMMARY"
