# Formly — docker-compose-based deploy pipeline.
#
# TAG GRAMMAR (decides what builds + deploys):
#
#   api-v<X.Y.Z>      → deploy ONLY the Go API
#                       e.g. git tag api-v1.4.2 && git push --tags
#
#   web-v<X.Y.Z>      → deploy ONLY the Next.js web app
#                       e.g. git tag web-v0.9.1 && git push --tags
#
#   release-v<X.Y.Z>  → deploy BOTH (use when a change crosses both
#                       halves and they need to ship together)
#                       e.g. git tag release-v2.0.0 && git push --tags
#
# Why split: a typo fix in the web costs ~3 min of API rebuild that
# changed nothing. Splitting keeps API-only deploys to ~1.5 min and
# rules out "did this web change affect the API?" anxiety.
#
# The version suffix (X.Y.Z) ends up as the docker image tag in
# ghcr.io and the VERSION ldflag in the Go binary, so /healthz can
# echo it.
#
# DEPLOY MECHANICS (per tag):
#   1. plan job parses the tag and decides which build job(s) run.
#   2. Only the relevant image(s) get rebuilt + pushed to ghcr.io.
#   3. deploy job SSHes to the VPS, rewrites the matching IMAGE
#      line(s) in /opt/formly/.env, and runs:
#        docker compose pull <changed services>
#        docker compose up -d <changed services>
#      Other containers (postgres, caddy, the half you didn't
#      deploy) stay untouched.
#
# REQUIRED REPO SECRETS:
#   HOSTINGER_HOST       — VPS IP or hostname
#   HOSTINGER_USER       — `deploy`
#   HOSTINGER_SSH_KEY    — private key (PEM) for the deploy user.
#                          Use the SAME key/value as bookmypg's
#                          working secret — that one is proven to
#                          authenticate against this VPS.
#   HOSTINGER_SSH_PORT   — optional, default 22
#
# REQUIRED REPO VARS (Settings → Variables → Actions):
#   API_DOMAIN           — api.drive360.nearbyme.app
#   WEB_DOMAIN           — drive360.nearbyme.app
#
# REGISTRY:
#   We push to ghcr.io/<owner>/<repo>-{api,web}. Auth uses the
#   built-in GITHUB_TOKEN. For private repos either set the package
#   to public OR provision a PAT with read:packages on the VPS.

name: deploy

on:
  push:
    tags:
      - "api-v*"
      - "web-v*"
      - "release-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which side(s) to deploy (manual override)"
        required: true
        type: choice
        default: release
        options:
          - api
          - web
          - release

# Don't run two deploys to the same ref simultaneously — the second
# one's `docker compose up` would race the first.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ═════════════════════════════════════════════════════════════
  # Parse the tag → decide which halves deploy + extract version.
  # All downstream jobs read these outputs.
  # ═════════════════════════════════════════════════════════════
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
      deploy_web: ${{ steps.decide.outputs.deploy_web }}
      image_tag:  ${{ steps.decide.outputs.image_tag }}
      repo_lower: ${{ steps.decide.outputs.repo_lower }}
    steps:
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            image_tag="manual-$(date -u +%Y%m%d-%H%M%S)"
          else
            ref="${GITHUB_REF#refs/tags/}"
            case "$ref" in
              api-v*)     target=api;     image_tag="${ref#api-v}";;
              web-v*)     target=web;     image_tag="${ref#web-v}";;
              release-v*) target=release; image_tag="${ref#release-v}";;
              *) echo "::error::Unknown tag shape: $ref"; exit 1;;
            esac
          fi
          case "$target" in
            api)     api=true;  web=false ;;
            web)     api=false; web=true  ;;
            release) api=true;  web=true  ;;
          esac
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "deploy_api=$api"   >> "$GITHUB_OUTPUT"
          echo "deploy_web=$web"   >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$repo_lower" >> "$GITHUB_OUTPUT"
          echo "Plan: api=$api web=$web tag=$image_tag repo=$repo_lower"

  # ═════════════════════════════════════════════════════════════
  # Build + push the API image. Skipped when deploy_api=false.
  # ═════════════════════════════════════════════════════════════
  build-api:
    needs: plan
    if: needs.plan.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-api:${{ needs.plan.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-api:latest
          build-args: |
            VERSION=${{ needs.plan.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ═════════════════════════════════════════════════════════════
  # Build + push the Web image. Skipped when deploy_web=false.
  # NEXT_PUBLIC_API_URL is baked in at build time → must come from
  # the API_DOMAIN repo variable.
  # ═════════════════════════════════════════════════════════════
  build-web:
    needs: plan
    if: needs.plan.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-web:${{ needs.plan.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.repo_lower }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ═════════════════════════════════════════════════════════════
  # SSH to the VPS, rewrite the relevant IMAGE line(s) in .env,
  # then `docker compose pull && up -d` ONLY the services that got
  # rebuilt. Postgres / Redis / MinIO / ONLYOFFICE / the
  # not-being-deployed half stay running.
  #
  # `if: !cancelled()` so this runs even when one of the build jobs
  # is skipped (skipped is success-with-no-output, but the default
  # `needs:` semantics treat skipped as "do not run the dependent").
  # We override that by gating on the plan flags directly.
  # ═════════════════════════════════════════════════════════════
  deploy:
    needs: [plan, build-api, build-web]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.plan.outputs.deploy_api == 'true' || needs.plan.outputs.deploy_web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
      DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
      DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '22' }}
      DEPLOY_API: ${{ needs.plan.outputs.deploy_api }}
      DEPLOY_WEB: ${{ needs.plan.outputs.deploy_web }}
      IMAGE_TAG:  ${{ needs.plan.outputs.image_tag }}
      # NB: ghcr.io is hardcoded here (not ${{ env.REGISTRY }})
      # because the `env` context is not in scope inside a job-level
      # `env:` block — GHA only resolves it inside steps.
      API_IMAGE:  ghcr.io/${{ needs.plan.outputs.repo_lower }}-api:${{ needs.plan.outputs.image_tag }}
      WEB_IMAGE:  ghcr.io/${{ needs.plan.outputs.repo_lower }}-web:${{ needs.plan.outputs.image_tag }}
    steps:
      # ────────── DEBUG ──────────
      # Fingerprint-only diagnostic. Confirms the secret currently in
      # HOSTINGER_SSH_KEY parses + which keypair it represents. The
      # fingerprint must equal:
      #   SHA256:CRZakjHBCvOblJveW9PIZpyI87OZpR7iXGu+kwKq8Yg
      # (the public key installed in /home/deploy/.ssh/authorized_keys
      # on the VPS — verified via `ssh-keygen -lf`).
      # If the fingerprint differs OR the key fails to parse, the
      # secret value is the problem. Remove this step once SSH is
      # green.
      - name: Verify SSH secret fingerprint
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$SSH_KEY" > "$tmp"
          chmod 600 "$tmp"
          if ! ssh-keygen -y -f "$tmp" > "${tmp}.pub" 2>/tmp/keygen.err; then
            echo "::error::HOSTINGER_SSH_KEY did not parse as a private key:"
            cat /tmp/keygen.err
            exit 1
          fi
          fp=$(ssh-keygen -lf "${tmp}.pub")
          echo "Secret fingerprint: $fp"
          expected="SHA256:CRZakjHBCvOblJveW9PIZpyI87OZpR7iXGu+kwKq8Yg"
          if echo "$fp" | grep -q "$expected"; then
            echo "✅ Fingerprint matches the public key on VPS authorized_keys."
          else
            echo "::error::Secret holds a DIFFERENT key than what's authorized on the VPS."
            echo "::error::Expected $expected"
            echo "::error::Re-upload with: gh secret set HOSTINGER_SSH_KEY < ~/.ssh/<correct-key-file>"
            exit 1
          fi

      # appleboy/ssh-action handles all the key-loading and known-hosts
      # gymnastics internally. The previous DIY approach (printf > file
      # + ssh) hit edge cases around trailing newlines, key formats,
      # and host-key verification that this action handles correctly.
      # ~30M deploys/month run on this — battle-tested.
      - name: Update .env on VPS with new image tag(s)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB,API_IMAGE,WEB_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/formly
            if [ "$DEPLOY_API" = "true" ]; then
              sed -i "s|^API_IMAGE=.*|API_IMAGE=$API_IMAGE|" .env
              echo "Set API_IMAGE=$API_IMAGE"
            fi
            if [ "$DEPLOY_WEB" = "true" ]; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=$WEB_IMAGE|" .env
              echo "Set WEB_IMAGE=$WEB_IMAGE"
            fi
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            echo "---"
            grep -E '^(API_IMAGE|WEB_IMAGE|IMAGE_TAG)=' .env

      - name: Pull and recreate changed services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: DEPLOY_API,DEPLOY_WEB
          # Compose pull/up timeout — image pulls + container starts
          # can take a couple of minutes on first deploy (cold image
          # cache). Default 10m is fine; explicit so it's reviewable.
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/formly

            services=""
            [ "$DEPLOY_API" = "true" ] && services="$services api"
            [ "$DEPLOY_WEB" = "true" ] && services="$services web"
            services=$(echo $services | xargs)
            echo "deploying: $services"

            # Pull only services that changed.
            docker compose pull $services

            # Recreate only those containers. --no-deps avoids
            # restarting postgres/redis just because api depends on
            # them.
            docker compose up -d --no-deps $services
            docker compose ps

      - name: Smoke test API
        if: needs.plan.outputs.deploy_api == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "https://${{ vars.API_DOMAIN }}/healthz" >/dev/null; then
              echo "API healthy on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, sleeping 5s…"
            sleep 5
          done
          echo "::error::API health check failed after 60s"
          exit 1

      - name: Smoke test Web
        if: needs.plan.outputs.deploy_web == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            if curl -fsS --max-time 8 "https://${{ vars.WEB_DOMAIN }}/" >/dev/null; then
              echo "Web healthy on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web health check failed"
          exit 1
