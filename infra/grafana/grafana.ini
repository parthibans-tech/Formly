# Grafana dev config — paired with the provisioning files in
# `provisioning/`. We deliberately do NOT enable anonymous read in
# this file (it's commented for documentation): in dev the Grafana
# admin login is `admin` / `admin` (changed on first login). For
# embedded views the API surfaces its own snapshot endpoint, so
# Grafana stays an operator tool.
#
# All meaningful state — datasources, dashboards — is provisioned
# from disk, so the container is treated as cattle: nuke the
# `grafanadata` volume and restart, and the same dashboards come
# back exactly as committed.

[server]
http_port = 3000
# Behind nginx/in-cluster you'd set root_url here. In dev we hit
# Grafana directly on the host port that docker-compose maps.

[security]
# Change me on first login. The admin user is required by Grafana;
# we don't use it for day-to-day reads — datasources and dashboards
# are provisioned and would survive a credential reset.
admin_user = admin
admin_password = admin
# Disabled cookie samesite=strict because the dev compose network
# doesn't terminate TLS; flip to `strict` in production where you
# always run behind HTTPS.
cookie_samesite = lax

[users]
# We don't want random sign-ups in an operator tool.
allow_sign_up = false

[auth.anonymous]
# Off in dev too — the dashboards expose enough data that we want
# at least the basic-auth gate.
enabled = false

[analytics]
# No phone-home in dev.
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[feature_toggles]
# `traceqlEditor` and `traceqlSearch` are stable but still gated
# behind a toggle in older Grafanas; flipping them on lights up the
# Tempo Explore tab.
enable = traceqlEditor traceqlSearch

[dashboards]
# Reload provisioned dashboards from disk every 10s so editing JSON
# in your editor reflects without a container restart.
min_refresh_interval = 5s
