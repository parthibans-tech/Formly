services:
  postgres:
    # pgvector/pgvector ships Postgres 16 with the `vector` extension
    # preinstalled. Same wire-compat as postgres:16-alpine — existing
    # migrations run unchanged. Required by migration 045 for the
    # AI smart-search feature; can be swapped back to postgres:16-alpine
    # in any deployment that disables AI (extension creation in 045
    # is `IF NOT EXISTS` and only fires when AI is on, but the type
    # `vector` won't be available at all without this image).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: drive360
      POSTGRES_PASSWORD: drive360
      POSTGRES_DB: drive360
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive360"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    # `redis-cli ping` returns PONG when the server is accepting
    # connections — cheaper than a full SET/GET round-trip and
    # ships with the same image, no extra binary needed. Anything
    # downstream that wants to wait for redis (queue workers in
    # prod compose, integration tests) can use `service_healthy`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [miniodata:/data]
    # MinIO ships `mc ready` checks via /minio/health/live — a 200
    # means the server has finished its self-check and is ready to
    # accept S3 calls. Probing this lets `minio-init` drop the
    # `sleep 3` and start the bucket-creation step immediately
    # once the server is actually up.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/drive360 || true
      "
    restart: "no"

  # ONLYOFFICE Document Server (Community Edition, AGPL).
  #
  # Runs alongside the rest of the dev stack on port 8090. JWT is
  # mandatory in production builds — we share the same secret via the
  # ONLYOFFICE_JWT_SECRET env var that the Go API also reads, so configs
  # the API mints can be verified by the document server, and save
  # callbacks the document server posts can be verified by the API.
  #
  # Network reachability: the ONLYOFFICE container runs in the compose
  # network and needs to reach the Go API (which runs on the host on
  # :8080) to fetch document bytes and to receive save callbacks. On
  # Docker Desktop (macOS / Windows) the magic hostname
  # `host.docker.internal` resolves to the host. On Linux dev machines
  # the equivalent is enabled by `extra_hosts` below.
  #
  # The Community edition is capped at 20 concurrent edit-mode
  # connections per server; that's plenty for early users. Mitigations
  # (default-to-view-mode, idle-tab disconnect, multi-instance sharding)
  # live in the API/UI layer, not here.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    ports:
      - "8090:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-dev-onlyoffice-secret}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      # ONLYOFFICE caches its document conversion outputs locally; in dev
      # we just let it churn on the container filesystem.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files

  # Ollama — local LLM runtime. Powers the AI feature seam in
  # `api/internal/ai`. The Go API process runs on the host (not in
  # this compose network), so we publish 11434 to the host and the
  # API connects via http://localhost:11434 (default in
  # api/internal/ai/ollama.go). Set AI_ENABLED=1 in api/.env to turn
  # AI features on; leave it unset and the whole stack continues to
  # run identically to before (the Disabled provider returns
  # ErrDisabled for every call).
  #
  # Model defaults are chosen for "works on a developer laptop":
  #   - llama3.1:8b           (chat, summarize, classify) — ~5GB
  #   - nomic-embed-text       (embeddings for smart search) — ~280MB
  # Override via AI_CHAT_MODEL / AI_EMBED_MODEL in api/.env when
  # benchmarking other models.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # No GPU passthrough by default — works on CPU, slow on big
    # models, fine for `nomic-embed-text` and small chat models.
    # Operators with NVIDIA GPUs should add `deploy.resources.reservations.devices`
    # for nvidia/gpu; Apple Silicon users running Docker Desktop get
    # CPU only (run Ollama natively on the host for Metal acceleration).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6

  # PaddleOCR sidecar — replaces the previous tesseract+poppler+
  # imagemagick stack the api process used to shell out to. The Go
  # api/internal/ocr package now talks to this service over HTTP at
  # PADDLE_OCR_URL (default http://localhost:8868 when running api on
  # the host, http://paddle-ocr:8868 when running it inside compose).
  #
  # Built from infra/paddle-ocr/. Models for English / Hindi / Tamil
  # are pre-downloaded at image build time so the first request after
  # a container restart doesn't pay a 30s download cost — additional
  # languages download lazily on first request and are cached in the
  # paddle_models volume across restarts.
  #
  # Memory: ~1GB resident with the three default engines warmed up
  # (PaddleOCR holds models in process memory; one engine ≈ 600MB,
  # subsequent langs share less weight). Scale with separate
  # containers, not extra workers in one container — uvicorn workers
  # multiply RAM linearly.
  paddle-ocr:
    build:
      context: ./paddle-ocr
      dockerfile: Dockerfile
    ports:
      - "8868:8868"
    volumes:
      # Cache downloaded model artifacts so a `docker compose down`
      # doesn't force re-download. Pre-baked models live in /root/.paddleocr;
      # the volume covers any extra languages a deploy adds at runtime.
      - paddle_models:/root/.paddleocr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8868/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-shot init container — pulls the embedding + chat models once
  # so the first inference call doesn't time out waiting on a multi-GB
  # download. Idempotent: `ollama pull` is a no-op when the model is
  # already present, so re-running `docker compose up` is safe.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      OLLAMA_HOST=ollama:11434 ollama pull nomic-embed-text &&
      OLLAMA_HOST=ollama:11434 ollama pull llama3.1:8b
      "
    restart: "no"

  # Prometheus — local scrape target for the API and worker /metrics
  # endpoints. Exposed on host port 9091 (NOT 9090, because the
  # worker process already binds :9090 on the host for its own
  # /metrics listener). Set `PROMETHEUS_URL=http://localhost:9091`
  # in api/.env to light up the Live Dashboard panels in
  # /admin/observability.
  #
  # The dev config (prometheus.dev.yml) skips basic auth and scrapes
  # host.docker.internal:{8080,9090}. The recording + alerting rule
  # files are mounted read-only next to it; edit them and `docker
  # compose kill -s SIGHUP prometheus` to reload without restart.
  prometheus:
    image: prom/prometheus:latest
    # Wait on the two services Prometheus actively talks to inside
    # the compose network. Prometheus would retry on its own if
    # alertmanager were unreachable, but starting it after
    # alertmanager is healthy means the very first alert evaluation
    # has somewhere to dispatch instead of logging push errors.
    # Blackbox is the same: every scrape of `formly-blackbox-*`
    # would 502 until blackbox is up, polluting the targets view.
    depends_on:
      alertmanager:
        condition: service_healthy
      blackbox:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      # Accept inbound remote_write so Tempo's metrics-generator
      # can push the service-graph histograms here. Without this
      # flag Tempo logs 404s on every push.
      - --web.enable-remote-write-receiver
      # Exemplars on histogram metrics — required for the
      # exemplar→trace pivot in Grafana. Off by default.
      - --enable-feature=exemplar-storage
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording.rules.yml:/etc/prometheus/recording.rules.yml:ro
      - ./prometheus/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:9090/-/healthy
      interval: 10s
      timeout: 3s
      retries: 6

  # Alertmanager — receives alerts from Prometheus and routes them
  # to PagerDuty / Slack / etc per the rules in
  # infra/alertmanager/alertmanager.yml. In dev the root route
  # default is `null` so alerts go nowhere; flip the root receiver
  # to `dev-firehose` (and set a real Slack webhook) to test
  # delivery locally. UI on http://localhost:9093.
  #
  # Reachable from Prometheus inside the compose network as
  # `alertmanager:9093`; the Prometheus alerting block in
  # prometheus.dev.yml uses that hostname.
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanagerdata:/alertmanager
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:9093/-/healthy
      interval: 10s
      timeout: 3s
      retries: 6

  # Tempo — local OpenTelemetry trace store. The API + worker
  # processes export OTLP/HTTP spans to localhost:4318 (mapped from
  # this container) and Tempo persists them for 14d. Exemplars on
  # the HTTP histogram (see api/internal/metrics) carry the
  # corresponding trace_id so a Grafana exemplar click takes the
  # operator straight to the slow request that produced the dot.
  #
  # Without Tempo (or another OTLP receiver) the exemplars still
  # render but click-through doesn't resolve to a trace.
  tempo:
    # Pinned to 2.6.x — the latest tag has shifted to a much
    # bigger backend-scheduler architecture whose config schema is
    # in flux. 2.6 is the last stable release with the simpler
    # ingester/compactor/storage blocks documented across the
    # broader OTel ecosystem. Bump intentionally when 3.x's config
    # surface settles.
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # tempo HTTP API (query)
      - "4317:4317"   # OTLP/gRPC ingest
      - "4318:4318"   # OTLP/HTTP ingest
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:3200/ready
      interval: 10s
      timeout: 3s
      retries: 6

  # Blackbox exporter — runs HTTP/TCP/DNS probes against an
  # operator-supplied list of targets and exposes `probe_*`
  # metrics on :9115/probe. Prometheus calls /probe with a
  # `module=` + `target=` query string per scrape; see the
  # `formly-blackbox` job in prometheus.dev.yml.
  #
  # Why a separate exporter (vs the API hitting itself): a probe
  # from outside the API process verifies the whole network
  # path (DNS → load balancer → TLS → the listener), not just
  # "the in-process handler returns 200." The /metrics endpoint
  # is also a much weaker liveness signal than a synthetic
  # request to a real route.
  blackbox:
    image: prom/blackbox-exporter:latest
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:9115/-/healthy
      interval: 10s
      timeout: 3s
      retries: 6

  # Loki — log aggregation backend. Receives lines from Promtail
  # over HTTP and persists them as compressed chunks indexed by a
  # tiny set of stream labels (service, level, trace_id). Pairs
  # with Tempo for trace<->log correlation: a log line with a
  # `trace_id` field becomes clickable in Grafana and resolves
  # straight to the matching span.
  #
  # Single-binary mode — fine up to a few thousand QPS on one
  # disk. Split into the microservices topology (ingester /
  # querier / distributor) when retention or volume warrants it.
  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:3100/ready
      interval: 10s
      timeout: 3s
      retries: 6

  # Promtail — log shipper. Tails every other container's stdout/
  # stderr via the docker.sock unix socket and pushes lines to
  # Loki. The pipeline_stages in promtail-config.yaml extract
  # `level` and `trace_id` from JSON log bodies and promote them
  # to stream labels — that's what makes the Grafana derived-field
  # click on a log line jump to the matching Tempo span.
  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only docker socket so promtail can discover containers
      # via the docker_sd_configs block. The socket is the
      # canonical Docker SD path and matches the Kubernetes
      # equivalent (file SD on /var/log/containers) so the same
      # config shape moves between environments.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtaildata:/tmp

  # postgres_exporter — exposes Postgres internals (replication
  # lag, long-running queries, connection state, table bloat) on
  # :9187/metrics. Custom queries layered on top live in
  # postgres-exporter/queries.yaml.
  #
  # Why this is separate from `formly_db_pool_*` (the pgxpool
  # metrics emitted by the API): those are about the *application*
  # using the database; this is about the *database itself*. A
  # blocked query that the API can't see (because its request
  # already returned) still shows up here.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://drive360:drive360@postgres:5432/drive360?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    ports:
      - "9187:9187"
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -q -O- http://localhost:9187/metrics | head -1 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 6

  # redis_exporter — Redis internals on :9121/metrics. Asynq sits
  # on top of Redis, so the queue dashboards lean on these series
  # (memory pressure, evicted keys, blocked clients).
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -q -O- http://localhost:9121/metrics | head -1 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 6

  # cAdvisor — per-container CPU / memory / network metrics on
  # :8081/metrics. Required because /metrics from the API +
  # worker only covers the Go process; cAdvisor covers everything
  # else in the compose stack (Postgres CPU, Tempo memory, etc.)
  # and is the de facto layer below node_exporter for "what's
  # this container actually using" questions.
  #
  # Linux-only filesystem mounts. macOS Docker Desktop doesn't
  # expose /sys/fs/cgroup the same way the linux kernel does,
  # so cadvisor is best-effort there — service comes up but a
  # subset of metrics will be missing. That's fine for a dev
  # laptop; in prod we run on Linux nodes where the picture is
  # complete.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 6

  # Pyroscope — continuous profiling. Pulls /debug/pprof/* from
  # the API + worker on a 15s cadence (see pyroscope.yaml) and
  # stores flame graphs by profile type (cpu, heap, goroutine,
  # allocs). Closes the LGTM+P loop: metrics tell you WHAT got
  # slow, traces tell you WHICH request, profiles tell you WHY
  # the function was hot.
  #
  # The scrape config targets host.docker.internal because the
  # Go API + worker run on the host (not in this compose
  # network). Same shape as how Prometheus reaches them via
  # extra_hosts. On Linux dev machines the extra_hosts entry
  # below makes that hostname resolve too.
  pyroscope:
    image: grafana/pyroscope:1.8.0
    command: ["-config.file=/etc/pyroscope/pyroscope.yaml"]
    ports:
      - "4040:4040"
    volumes:
      - ./pyroscope/pyroscope.yaml:/etc/pyroscope/pyroscope.yaml:ro
      - pyroscopedata:/var/pyroscope/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:4040/ready
      interval: 10s
      timeout: 3s
      retries: 6

  # Grafana — operator dashboards. Provisioned from disk:
  # datasources (Prometheus + Tempo + Alertmanager) and the four
  # dashboards under infra/grafana/dashboards/. The container
  # itself is treated as cattle — wipe `grafanadata` and the
  # same dashboards come back on startup.
  #
  # Port 3001 on the host because :3000 is taken by the Next.js
  # web app. The Grafana process inside still listens on 3000.
  #
  # First-login credentials: admin / admin (forced password
  # rotation on first sign-in). Datasources work without a
  # login because they're proxy-mode and gated by the dashboard
  # itself, not by a per-source credential.
  grafana:
    image: grafana/grafana:11.2.0
    # All four datasources are provisioned at boot — Grafana
    # marks a datasource as failing if it can't reach the URL on
    # the first health check. Waiting for each backend to report
    # healthy means the Datasources page is green from the very
    # first refresh instead of needing a manual reload.
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      loki:
        condition: service_healthy
      pyroscope:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://localhost:3000/api/health || exit 1"
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
  miniodata:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  ollama_data:
  paddle_models:
  promdata:
  alertmanagerdata:
  tempodata:
  grafanadata:
  lokidata:
  promtaildata:
  pyroscopedata:
