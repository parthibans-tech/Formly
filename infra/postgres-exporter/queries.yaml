# Custom queries layered on top of postgres_exporter's built-in
# pg_stat_* set. Each block becomes a Prometheus metric prefixed
# with `pg_<name>_`. We deliberately keep this list short — the
# default exporter already publishes 200+ time series; everything
# below is something we'd otherwise have to add a recording rule
# for in Prometheus.

pg_replication_lag:
  query: |
    SELECT
      CASE
        WHEN NOT pg_is_in_recovery() THEN 0
        ELSE EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))
      END AS lag_seconds
  master: true
  metrics:
    - lag_seconds:
        usage: GAUGE
        description: "Replication lag in seconds (0 on a primary)."

pg_long_running:
  # Counts queries that have been running longer than 60s. A
  # spike here usually means a missing index, a lock cycle, or a
  # batch job that escaped its budget.
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE state = 'active'
      AND now() - query_start > interval '60 seconds'
  master: true
  metrics:
    - count:
        usage: GAUGE
        description: "Active queries running longer than 60 seconds."

pg_blocked_queries:
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
  master: true
  metrics:
    - count:
        usage: GAUGE
        description: "Connections currently blocked on a Lock wait event."

pg_table_bloat_estimate:
  # Rough estimate (no pg_repack required). Surfaced because table
  # bloat is the cause of most "Postgres got slow without us doing
  # anything" tickets.
  query: |
    SELECT
      schemaname,
      relname AS table_name,
      n_dead_tup,
      n_live_tup,
      CASE WHEN n_live_tup > 0 THEN
        ROUND((n_dead_tup::numeric / n_live_tup::numeric), 4)
      ELSE 0 END AS dead_ratio
    FROM pg_stat_user_tables
    WHERE n_dead_tup > 1000
  master: true
  metrics:
    - schemaname:
        usage: LABEL
    - table_name:
        usage: LABEL
    - n_dead_tup:
        usage: GAUGE
        description: "Dead tuples in this table awaiting vacuum."
    - n_live_tup:
        usage: GAUGE
        description: "Live tuples in this table."
    - dead_ratio:
        usage: GAUGE
        description: "n_dead_tup / n_live_tup (0..N)."
