# formly.conf — public nginx site config for Formly on Hostinger.
#
# Drop this at /etc/nginx/sites-available/formly.conf and symlink
# into /etc/nginx/sites-enabled/. Two server blocks: API on
# api.<DOMAIN>, web on <DOMAIN> (and www.<DOMAIN>).
#
# Both server blocks proxy to upstreams defined in
# /etc/nginx/snippets/formly-{api,web}-upstream.conf. Those snippets
# are the blue/green selector — install-{api,web}.sh atomically
# rewrites them during a deploy.
#
# Before installing:
#   1. sed -i 's/__DOMAIN__/yourdomain.com/g' formly.conf
#   2. Provision certs:
#        sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com -d api.yourdomain.com
#      Certbot will rewrite the listen 443 / ssl_certificate lines
#      itself the first time; on subsequent renewals it leaves them
#      alone.
#   3. sudo nginx -t && sudo systemctl reload nginx

# Upstream blocks live in their own files so the deploy script can
# atomically swap them without touching the rest of the config.
include /etc/nginx/snippets/formly-api-upstream.conf;
include /etc/nginx/snippets/formly-web-upstream.conf;

# Rate-limit zones. The API zone is tighter — login / OCR endpoints
# are the abuse targets. Web is permissive because Next.js fans a
# single page load into many static + RSC requests.
limit_req_zone $binary_remote_addr zone=formly_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=formly_web:10m rate=60r/s;

# ---------------------------------------------------------------
# HTTP → HTTPS redirect (certbot manages the cert; this block is
# what it edits). Keep ACME challenge path open for renewals.
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ api.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------
# API — api.__DOMAIN__
# ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.__DOMAIN__;

    # Certbot fills these in on first run; placeholders here so
    # `nginx -t` works pre-cert (the bootstrap script provisions a
    # snakeoil cert until certbot replaces it).
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # OCR uploads can be a few MB (multi-page scans). Cap at 25 MB
    # — matches the API's own MaxUploadSize. Keep them in sync.
    client_max_body_size 25m;
    client_body_timeout  60s;

    # Long-poll / streaming endpoints (AI summarise) need generous
    # read timeouts; Ollama can take 30 s+ on the first token.
    proxy_read_timeout    120s;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;

    # Standard proxy hygiene.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";   # enable upstream keepalive

    # Health check exempted from rate limit so the deploy script's
    # smoke test can hammer it.
    location = /healthz {
        proxy_pass http://formly_api;
        access_log off;
    }

    location / {
        limit_req zone=formly_api burst=40 nodelay;
        proxy_pass http://formly_api;
    }
}

# ---------------------------------------------------------------
# Web — __DOMAIN__ (apex + www)
# ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Next.js static assets — let nginx hold them for a year.
    # _next/static is content-hashed so this is safe.
    location /_next/static/ {
        proxy_pass http://formly_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Image optimiser route — Next handles caching headers itself.
    location /_next/image {
        proxy_pass http://formly_web;
    }

    location / {
        limit_req zone=formly_web burst=120 nodelay;
        proxy_pass http://formly_web;
    }
}
