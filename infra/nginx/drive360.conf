# /etc/nginx/sites-available/drive360  (deployed from this repo)
#
# Source of truth for the Drive360 nginx config. Deploy pipeline
# scp's this file to the VPS and reloads nginx — DO NOT edit it
# in place on the VPS, your changes will be overwritten.
#
# Why TLS settings are baked in (not added by `certbot --nginx`):
#   We use `certbot certonly --webroot` so certbot ONLY writes
#   cert files under /etc/letsencrypt/live/<domain>/. nginx config
#   stays repo-owned. Renewal cron just refreshes those PEMs in
#   place — nginx picks them up on its next reload.
#
# One-time VPS prep (must be done before first nginx-v* deploy):
#   1. mkdir -p /drive360/certbot
#   2. Issue certs once:
#        certbot certonly --webroot -w /drive360/certbot \
#          --cert-name drive360.nearbyme.app \
#          -d drive360.nearbyme.app \
#          -d api.drive360.nearbyme.app \
#          -d office.drive360.nearbyme.app \
#          -d s3.drive360.nearbyme.app
#   3. ln -sf /etc/nginx/sites-available/drive360 /etc/nginx/sites-enabled/drive360
#
# Adding a NEW subdomain to the existing cert later:
#   certbot certonly --webroot -w /drive360/certbot \
#     --cert-name drive360.nearbyme.app --expand \
#     -d drive360.nearbyme.app \
#     -d api.drive360.nearbyme.app \
#     -d office.drive360.nearbyme.app \
#     -d s3.drive360.nearbyme.app
#   nginx -t && systemctl reload nginx

# Maps client Upgrade header for WebSocket support (ONLYOFFICE editor channel).
# If you have this defined elsewhere in nginx.conf, drop this block.
map $http_upgrade $drive360_connection {
    default upgrade;
    ''      close;
}

# ── ACME HTTP-01 webroot challenge — shared by all domains ──
# certbot writes challenge files into /drive360/certbot/.well-known/
# during renewal. Catches port-80 traffic for every Drive360 host.
server {
    listen 80;
    server_name drive360.nearbyme.app api.drive360.nearbyme.app office.drive360.nearbyme.app s3.drive360.nearbyme.app;

    location /.well-known/acme-challenge/ {
        root /drive360/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Web (Next.js) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name drive360.nearbyme.app;

    ssl_certificate     /etc/letsencrypt/live/drive360.nearbyme.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive360.nearbyme.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $drive360_connection;
        proxy_read_timeout 300s;
    }
}

# ── API (Go) ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.drive360.nearbyme.app;

    ssl_certificate     /etc/letsencrypt/live/drive360.nearbyme.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive360.nearbyme.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (docx/xlsx/pdf) flow through this proxy. Bumping past 50M
    # because some users attach scanned PDFs. The API enforces its own
    # per-tenant limit beyond this.
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads to the backend instead of buffering the whole
        # file in nginx first — keeps memory flat on big uploads.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
}

# ── MinIO (S3-compatible) ──────────────────────────────────
# Browsers POST/PUT directly to MinIO via presigned URLs from the API.
# nginx is just a TLS terminator + cert host — keep buffering OFF so
# uploads stream straight through.
server {
    listen 443 ssl http2;
    server_name s3.drive360.nearbyme.app;

    ssl_certificate     /etc/letsencrypt/live/drive360.nearbyme.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive360.nearbyme.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # MinIO accepts up to 5 GiB single-PUT; cap here matches API limit
    # since nothing in product needs bigger today.
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream the upload — don't let nginx buffer the whole file.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# ── ONLYOFFICE Document Server ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name office.drive360.nearbyme.app;

    ssl_certificate     /etc/letsencrypt/live/drive360.nearbyme.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive360.nearbyme.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade — the editor maintains a long-lived channel
        # for live collaboration / autosave events.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $drive360_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
