# formly-web-upstream.conf — blue/green selector for the Next.js web.
#
# Same pattern as formly-api-upstream.conf. install-web.sh rewrites
# this file during a deploy and reloads nginx.
#
# Ports:
#   blue  → 127.0.0.1:3000  (formly-web@blue.service)
#   green → 127.0.0.1:3001  (formly-web@green.service)

upstream formly_web {
    # ACTIVE_SLOT=blue
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;

    keepalive 32;
}
