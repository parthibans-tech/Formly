# formly-api-upstream.conf — blue/green selector for the Go API.
#
# This file is REWRITTEN by scripts/deploy/install-api.sh during a
# deploy. Exactly one `server` line is uncommented; the other is
# commented out. The deploy script writes a new copy to
# formly-api-upstream.conf.new, then `mv`s it over this one (atomic
# on the same filesystem) and runs `nginx -s reload`.
#
# Why a separate file (not inlined in formly.conf): atomic swap is
# safer than sed-in-place, and `nginx -s reload` re-reads everything
# included from the main config without dropping established
# connections.
#
# Ports:
#   blue  → 127.0.0.1:8080  (formly-api@blue.service)
#   green → 127.0.0.1:8081  (formly-api@green.service)
#
# After-deploy invariant: exactly one server line active, matching
# the slot name written in /opt/formly/api/active.

upstream formly_api {
    # ACTIVE_SLOT=blue
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;

    keepalive 32;
}
