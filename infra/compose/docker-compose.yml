# Drive360 — full-stack docker compose deployment.
#
# This file describes EVERYTHING that runs on the VPS. The deploy
# pipeline only needs to:
#   1. SSH in
#   2. cd /opt/drive360
#   3. docker compose pull   # grabs new api/web images from ghcr.io
#   4. docker compose up -d  # recreates anything whose image changed
#
# That's the whole "one-push deploy" — no install scripts, no
# symlink swaps, no nginx surgery.
#
# Public surface: nothing in this stack listens on a public port.
# The host's nginx (shared with other projects on this VPS) owns
# :80 / :443 and reverse-proxies into these containers via their
# 127.0.0.1:<port> bindings below. nginx handles TLS via certbot.
#
# State lives in named volumes (postgres_data, redis_data, …) which
# survive `docker compose down`. To wipe everything: `docker compose
# down -v` (the -v drops volumes too — DESTRUCTIVE).
#
# Image tag flow:
#   • Local dev: `docker compose build` rebuilds api+web from source.
#   • CI:        builds and pushes to ghcr.io/<org>/<repo>-{api,web}.
#                The deploy step `docker compose pull` grabs new tags.
#   • Both code paths share THIS file — toggled via the
#     IMAGE_TAG / API_IMAGE / WEB_IMAGE env vars in .env.

name: drive360

# Default networks: one for everything. Docker creates a bridge
# network with built-in DNS so services reach each other by name
# (postgres, redis, api, etc.).
networks:
  default:
    name: drive360

services:
  # ────────────────────────────────────────────────────────────
  # API — Go service, built from api/Dockerfile.
  #
  # Bound to 127.0.0.1:8080 so only the host's nginx (running on
  # the VPS, shared with other projects) can reach it. Public
  # traffic enters via nginx → 127.0.0.1:8080.
  # ────────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-ghcr.io/your-org/drive360-api:latest}
    ports:
      - "127.0.0.1:8080:8080"
    # `build:` only kicks in for local `docker compose build`. CI
    # ignores this and uses the pre-built image. Keeping it here so
    # `docker compose up --build` works from a fresh clone.
    build:
      context: ../../api
      dockerfile: Dockerfile
      args:
        # VERSION → APP_VERSION env in the image. Passed through here
        # from IMAGE_TAG so a tagged release (e.g. v1.4.2) shows up on
        # the "Running versions" card without extra wiring. APP_COMMIT
        # should be the short git SHA — your CI sets it to
        # `$(git rev-parse --short HEAD)`; locally `make build` does
        # the same. Falls back to "unknown" if neither is set.
        VERSION: ${IMAGE_TAG:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      # ── Connections (resolved by docker DNS, never localhost) ──
      DATABASE_URL: postgres://drive360:${POSTGRES_PASSWORD}@postgres:5432/drive360?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # ── Auth ──
      JWT_SECRET: ${JWT_SECRET}
      # ── MinIO (S3-compatible) — names match api/internal/storage/storage.go ──
      # MINIO_ENDPOINT (internal) is host:port, no scheme. Always minio:9000.
      # MINIO_PUBLIC_ENDPOINT is what the browser sees in presigned URLs:
      #   - leave blank → presigns use the internal endpoint (only OK if
      #     uploads are proxied through the API, NOT direct browser→MinIO)
      #   - set to e.g. s3.drive360.nearbyme.app (no scheme) AND set
      #     MINIO_PUBLIC_SSL=true once nginx fronts MinIO with TLS
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${DOMAIN_S3:-}
      MINIO_PUBLIC_SSL: ${MINIO_PUBLIC_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-drive360}
      MINIO_REGION: us-east-1
      MINIO_SSL: "false"
      # ── AI (Ollama in this same compose, optional) ──
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-llama3.2:3b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TIMEOUT_SEC: ${AI_TIMEOUT_SEC:-180}
      DOCCHAT_TIMEOUT_SEC: ${DOCCHAT_TIMEOUT_SEC:-180}
      # ── OCR (PaddleOCR sidecar) ──
      # The api talks HTTP to the paddle-ocr service in this compose.
      # Without OCR_ENABLED=1, scanned PDFs and image uploads return
      # 415 not_textual from /v1/files/{id}/extract-text. OCR_LANG uses
      # PaddleOCR's ISO codes (en, hi, ta, ch, ja, ko, fr, ...). The
      # legacy tesseract codes (eng/hin/tam/...) are auto-translated
      # by the sidecar so old config + DB rows keep working through a
      # rolling upgrade.
      OCR_ENABLED: ${OCR_ENABLED:-1}
      OCR_LANG: ${OCR_LANG:-en}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-30}
      PADDLE_OCR_URL: ${PADDLE_OCR_URL:-http://paddle-ocr:8868}
      # ── ONLYOFFICE ──
      # ONLYOFFICE_PUBLIC_URL is the URL the BROWSER loads api.js from.
      # Must be HTTPS in prod (matches DOMAIN_OFFICE behind nginx).
      # ONLYOFFICE_INTERNAL_API_URL is the URL the document server uses
      # to call BACK to the API (download / save callbacks). Inside
      # the docker network the API is reachable as http://api:8080.
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-https://${DOMAIN_OFFICE}}
      ONLYOFFICE_INTERNAL_API_URL: ${ONLYOFFICE_INTERNAL_API_URL:-http://api:8080}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      # ── Misc ──
      LISTEN_ADDR: ":8080"
      # Browser origins allowed to call the API. Comma-separated, no
      # trailing slashes. Defaults cover dev; prod is set via .env.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_WEB}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # paddle-ocr is best-effort: api boots fine if the sidecar
      # is still warming up (the OCR call returns a 502 ai_error
      # at request time and the rest of the api keeps working).
      # Use service_started rather than service_healthy so a slow
      # model load doesn't block api startup on cold deploys.
      paddle-ocr:
        condition: service_started
    # Memory hint to docker. Not a hard cap (no `mem_limit`) — that
    # would OOM-kill rather than swap, which is harsher than we want
    # on a single VPS where bursts are normal.
    deploy:
      resources:
        limits:
          memory: 768M

  # ────────────────────────────────────────────────────────────
  # Web — Next.js standalone, built from web/Dockerfile.
  #
  # Bound to 127.0.0.1:3030 — nginx proxies the public domain to
  # this port. Container internally still listens on :3000; only the
  # host-side port differs (3000 is taken by another project on this
  # VPS).
  # ────────────────────────────────────────────────────────────
  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/drive360-web:latest}
    ports:
      - "127.0.0.1:3030:3000"
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* baked into the bundle at build time. Changing
        # these requires a fresh `web` image — the values are compiled
        # into the JS bundle and CSP headers, NOT read at runtime.
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}
        # Storage URL is the public MinIO host (DOMAIN_S3). Browsers
        # POST presigned uploads here, and the CSP connect-src/frame-src
        # directives in next.config.js whitelist exactly this origin.
        # Falls back to the API domain only if DOMAIN_S3 isn't set
        # (e.g. uploads proxied through the API instead).
        NEXT_PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-https://${DOMAIN_S3:-${DOMAIN_API}}}
        # ONLYOFFICE public host. Baked into CSP's script-src + frame-src
        # so the editor page can inject api.js from this origin and
        # iframe the editor without violating CSP. Leave unset if the
        # deploy doesn't run ONLYOFFICE.
        NEXT_PUBLIC_OFFICE_URL: ${NEXT_PUBLIC_OFFICE_URL:-https://${DOMAIN_OFFICE}}
    restart: unless-stopped
    environment:
      # Server-side env (the Next.js node process). Anything the SSR
      # path needs that isn't NEXT_PUBLIC_*. Right now nothing.
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  # ────────────────────────────────────────────────────────────
  # Postgres + pgvector. The pgvector image is a drop-in pg16 with
  # the `vector` extension precompiled — saves us building it.
  # ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drive360
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script auto-creates the `vector` extension in the
      # `drive360` DB on first boot. Idempotent.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive360 -d drive360"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ────────────────────────────────────────────────────────────
  # Redis. Default config, AOF off — used as a session/cache store,
  # losing it on container restart is acceptable.
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage. Single-node deployment;
  # data lives in /var/lib/minio on the host (volume below).
  #
  # The API talks to it over the docker network as `minio:9000`.
  # For browser presigned-URL uploads, expose this via nginx on
  # an `s3.<domain>` host → 127.0.0.1:9000. Console (admin UI)
  # stays internal — proxy 127.0.0.1:9001 only if you need it.
  # ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ────────────────────────────────────────────────────────────
  # MinIO bucket bootstrap. One-shot container that creates the
  # `drive360` bucket on first start, then exits. Re-runs are no-ops.
  # ────────────────────────────────────────────────────────────
  minio-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-drive360} &&
      mc anonymous set download local/${S3_BUCKET:-drive360} || true;
      echo 'minio bucket ready';
      "
    restart: "no"

  # ────────────────────────────────────────────────────────────
  # ONLYOFFICE Document Server. Heavy — ~1.5 GB resident. Disable
  # by removing this service or setting profile `office` (compose
  # `--profile` flag) if you don't need it.
  #
  # The container speaks HTTP only on :80; nginx fronts it with TLS
  # via the office subdomain → 127.0.0.1:8090.
  # ────────────────────────────────────────────────────────────
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: AuthorizationJwt
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 1500M

  # ────────────────────────────────────────────────────────────
  # Worker — async job runner (asynq consumer). Same image as the
  # API; CMD overridden so it launches /app/drive360-worker. Picks
  # up jobs the API enqueues onto Redis: antivirus scans, AI
  # embeddings, scheduled merges, webhook deliveries, etc.
  #
  # Without this service running, any code path that calls
  # queue.NewClient(...).Enqueue(...) succeeds at the API level
  # (the task lands in Redis) but nothing ever processes it. The
  # antivirus gate is the most visible victim — files sit in
  # `status='scanning'` forever and the download handler refuses
  # them.
  #
  # Resource budget kept modest: scans stream from MinIO straight
  # to clamd over the network — neither side holds the whole blob,
  # so memory tracks Concurrency * (chunk buffer) not file size.
  # ────────────────────────────────────────────────────────────
  worker:
    image: ${API_IMAGE:-ghcr.io/your-org/drive360-api:latest}
    build:
      context: ../../api
      dockerfile: Dockerfile
      args:
        # Same image, same build args — both binaries ship together,
        # so the worker's APP_VERSION / APP_COMMIT match the api's.
        VERSION: ${IMAGE_TAG:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    command: ["/app/drive360-worker"]
    restart: unless-stopped
    environment:
      # Worker shares the API's data plane: same DB, same Redis,
      # same MinIO. Anything the API writes, the worker reads.
      DATABASE_URL: postgres://drive360:${POSTGRES_PASSWORD}@postgres:5432/drive360?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-drive360}
      MINIO_REGION: us-east-1
      MINIO_SSL: "false"
      # Antivirus: when CLAMAV_ADDR is set, scanner.FromEnv
      # returns the ClamAV TCP scanner; unset → Noop (every scan
      # comes back Skipped). The clamav service below exposes
      # clamd on the docker network at clamav:3310.
      CLAMAV_ADDR: ${CLAMAV_ADDR:-clamav:3310}
      # AI mirrors the API's config so async embeddings / autotag
      # use the same provider the inline path does. Toggle off
      # globally by setting AI_ENABLED=false in .env.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-llama3.2:3b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TIMEOUT_SEC: ${AI_TIMEOUT_SEC:-180}
      # Worker shares the api's OCR config so async embeddings of
      # scanned PDFs use the same PaddleOCR sidecar the inline path
      # does. Without these vars the worker silently falls back to
      # "no OCR" and embeds a placeholder body string.
      OCR_ENABLED: ${OCR_ENABLED:-1}
      OCR_LANG: ${OCR_LANG:-en}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-30}
      PADDLE_OCR_URL: ${PADDLE_OCR_URL:-http://paddle-ocr:8868}
      # Worker exposes /metrics on :9090 for Prometheus. Bound to
      # the docker network only (no host port published) — scrape
      # via the prometheus service in infra/observability.
      WORKER_METRICS_ADDR: ":9090"
      METRICS_BASIC_AUTH_USER: ${METRICS_BASIC_AUTH_USER:-}
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ────────────────────────────────────────────────────────────
  # ClamAV daemon — backs the antivirus-scan toggle on the
  # upload-policy surface. The official image bundles freshclam
  # (signature updater) and clamd (scan daemon) in one process
  # supervisor; first boot downloads the full signature DB
  # (~250 MB) before clamd will accept connections — the
  # healthcheck below waits on that.
  #
  # Memory budget: clamd loads the entire signature DB into RAM.
  # 1.5 GB is the documented minimum for the default ruleset;
  # going lower causes clamd to refuse to start with
  # "LibClamAV Error: cli_loaddb...". On a tight VPS, scale this
  # down only after pruning rules.
  # ────────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      # Persist the signature DB across restarts so freshclam
      # doesn't re-download 250 MB on every redeploy.
      - clamav_data:/var/lib/clamav
    healthcheck:
      # `clamdcheck.sh` is a shipped helper that pings clamd via
      # the local socket; it returns non-zero until the daemon
      # has loaded its DB and is accepting INSTREAM scans.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1500M

  # ────────────────────────────────────────────────────────────
  # PaddleOCR sidecar — replaces tesseract+poppler+imagemagick.
  # The api/internal/ocr package speaks HTTP to this service.
  #
  # Image is built locally from infra/paddle-ocr/. Pre-downloads
  # PP-OCRv4 weights for English, Hindi, and Tamil during the image
  # build so the first request after a deploy doesn't pay model-load
  # latency. Additional languages lazy-download on first use and
  # cache in the paddle_models volume.
  #
  # Memory budget: ~200 MB resident for the RapidOCR engine (ONNX
  # session + PP-OCRv4 mobile weights), plus a transient ~500 MB
  # headroom for /raster/pdf and /layout/pdf when called against a
  # 30-page document (pdf2image holds all pages in PIL Image objects
  # before iteration in the OCR loop). 1 GB gives a safety cushion
  # without competing with onlyoffice / ollama on a 4 GB VPS. Down
  # from the prior 2 GB cap that targeted PaddlePaddle's heavier
  # ~600 MB resident footprint.
  # No public port — the api reaches it on the docker network as
  # paddle-ocr:8868.
  # ────────────────────────────────────────────────────────────
  paddle-ocr:
    image: ${PADDLE_OCR_IMAGE:-ghcr.io/your-org/drive360-paddle-ocr:latest}
    # Service name is `paddle-ocr` for historical reasons (the sidecar
    # originally wrapped PaddleOCR). Runtime is now RapidOCR (ONNX),
    # which has multi-arch wheels — builds and runs natively on both
    # linux/amd64 (VPS) and linux/arm64 (Apple Silicon dev) without
    # any platform pin or emulation.
    build:
      context: ../paddle-ocr
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # External model directory for non-latin scripts (Hindi, Tamil,
      # Bengali, ...). Operators populate ./paddle-ocr/models/<lang>/
      # with det.onnx + rec.onnx + keys.txt downloaded from the
      # RapidOCR releases page. Empty by default — the bundled latin
      # multilingual model in the wheel covers en/fr/de/es/pt/it/nl
      # without anything mounted here. The prior PaddleOCR build
      # mounted /root/.paddleocr/ for the same purpose; the new
      # location is explicit (under /app) so operators don't ship
      # state-into-home-dir hacks.
      - ../paddle-ocr/models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8868/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ────────────────────────────────────────────────────────────
  # Ollama — local AI. Big (~4 GB image, models are 2-7 GB each
  # in the volume). On KVM 2 (8 GB RAM total) this competes hard
  # with ONLYOFFICE; pick one or upgrade.
  #
  # Activated via compose profile so a default `up` doesn't pull
  # the image unless WITH_OLLAMA=1 in .env enables the profile.
  # ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  redis_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
  ollama_data:
  clamav_data:
