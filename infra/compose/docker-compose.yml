# Drive360 — full-stack docker compose deployment.
#
# This file describes EVERYTHING that runs on the VPS. The deploy
# pipeline only needs to:
#   1. SSH in
#   2. cd /opt/drive360
#   3. docker compose pull   # grabs new api/web images from ghcr.io
#   4. docker compose up -d  # recreates anything whose image changed
#
# That's the whole "one-push deploy" — no install scripts, no
# symlink swaps, no nginx surgery.
#
# Public surface: nothing in this stack listens on a public port.
# The host's nginx (shared with other projects on this VPS) owns
# :80 / :443 and reverse-proxies into these containers via their
# 127.0.0.1:<port> bindings below. nginx handles TLS via certbot.
#
# State lives in named volumes (postgres_data, redis_data, …) which
# survive `docker compose down`. To wipe everything: `docker compose
# down -v` (the -v drops volumes too — DESTRUCTIVE).
#
# Image tag flow:
#   • Local dev: `docker compose build` rebuilds api+web from source.
#   • CI:        builds and pushes to ghcr.io/<org>/<repo>-{api,web}.
#                The deploy step `docker compose pull` grabs new tags.
#   • Both code paths share THIS file — toggled via the
#     IMAGE_TAG / API_IMAGE / WEB_IMAGE env vars in .env.

name: drive360

# Default networks: one for everything. Docker creates a bridge
# network with built-in DNS so services reach each other by name
# (postgres, redis, api, etc.).
networks:
  default:
    name: drive360

services:
  # ────────────────────────────────────────────────────────────
  # API — Go service, built from api/Dockerfile.
  #
  # Bound to 127.0.0.1:8080 so only the host's nginx (running on
  # the VPS, shared with other projects) can reach it. Public
  # traffic enters via nginx → 127.0.0.1:8080.
  # ────────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-ghcr.io/your-org/drive360-api:latest}
    ports:
      - "127.0.0.1:8080:8080"
    # `build:` only kicks in for local `docker compose build`. CI
    # ignores this and uses the pre-built image. Keeping it here so
    # `docker compose up --build` works from a fresh clone.
    build:
      context: ../../api
      dockerfile: Dockerfile
      args:
        VERSION: ${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      # ── Connections (resolved by docker DNS, never localhost) ──
      DATABASE_URL: postgres://drive360:${POSTGRES_PASSWORD}@postgres:5432/drive360?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # ── Auth ──
      JWT_SECRET: ${JWT_SECRET}
      # ── S3 (MinIO inside the network) ──
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-drive360}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"   # MinIO needs path-style addressing
      # ── AI (Ollama in this same compose, optional) ──
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-llama3.2:3b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TIMEOUT_SEC: ${AI_TIMEOUT_SEC:-180}
      DOCCHAT_TIMEOUT_SEC: ${DOCCHAT_TIMEOUT_SEC:-180}
      # ── ONLYOFFICE ──
      ONLYOFFICE_URL: http://onlyoffice
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      # ── Misc ──
      LISTEN_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Memory hint to docker. Not a hard cap (no `mem_limit`) — that
    # would OOM-kill rather than swap, which is harsher than we want
    # on a single VPS where bursts are normal.
    deploy:
      resources:
        limits:
          memory: 768M

  # ────────────────────────────────────────────────────────────
  # Web — Next.js standalone, built from web/Dockerfile.
  #
  # Bound to 127.0.0.1:3030 — nginx proxies the public domain to
  # this port. Container internally still listens on :3000; only the
  # host-side port differs (3000 is taken by another project on this
  # VPS).
  # ────────────────────────────────────────────────────────────
  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/drive360-web:latest}
    ports:
      - "127.0.0.1:3030:3000"
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* baked into the bundle at build time.
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}
        NEXT_PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-https://${DOMAIN_API}}
    restart: unless-stopped
    environment:
      # Server-side env (the Next.js node process). Anything the SSR
      # path needs that isn't NEXT_PUBLIC_*. Right now nothing.
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  # ────────────────────────────────────────────────────────────
  # Postgres + pgvector. The pgvector image is a drop-in pg16 with
  # the `vector` extension precompiled — saves us building it.
  # ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drive360
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script auto-creates the `vector` extension in the
      # `drive360` DB on first boot. Idempotent.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive360 -d drive360"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ────────────────────────────────────────────────────────────
  # Redis. Default config, AOF off — used as a session/cache store,
  # losing it on container restart is acceptable.
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage. Single-node deployment;
  # data lives in /var/lib/minio on the host (volume below).
  #
  # The API talks to it over the docker network as `minio:9000`.
  # For browser presigned-URL uploads, expose this via nginx on
  # an `s3.<domain>` host → 127.0.0.1:9000. Console (admin UI)
  # stays internal — proxy 127.0.0.1:9001 only if you need it.
  # ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ────────────────────────────────────────────────────────────
  # MinIO bucket bootstrap. One-shot container that creates the
  # `drive360` bucket on first start, then exits. Re-runs are no-ops.
  # ────────────────────────────────────────────────────────────
  minio-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-drive360} &&
      mc anonymous set download local/${S3_BUCKET:-drive360} || true;
      echo 'minio bucket ready';
      "
    restart: "no"

  # ────────────────────────────────────────────────────────────
  # ONLYOFFICE Document Server. Heavy — ~1.5 GB resident. Disable
  # by removing this service or setting profile `office` (compose
  # `--profile` flag) if you don't need it.
  #
  # The container speaks HTTP only on :80; nginx fronts it with TLS
  # via the office subdomain → 127.0.0.1:8090.
  # ────────────────────────────────────────────────────────────
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: AuthorizationJwt
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 1500M

  # ────────────────────────────────────────────────────────────
  # Ollama — local AI. Big (~4 GB image, models are 2-7 GB each
  # in the volume). On KVM 2 (8 GB RAM total) this competes hard
  # with ONLYOFFICE; pick one or upgrade.
  #
  # Activated via compose profile so a default `up` doesn't pull
  # the image unless WITH_OLLAMA=1 in .env enables the profile.
  # ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  redis_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
  ollama_data:
